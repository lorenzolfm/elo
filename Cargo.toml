[package]
name = "elo"
version = "0.1.0"
edition = "2024"
description = "A Bitcoin node daemon"
repository = "https://github.com/lorenzolfm/elo"
publish = false

[dependencies]
bitcoin_hashes = { version = "1.2.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }
