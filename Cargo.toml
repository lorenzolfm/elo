[package]
name = "elo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# Dependencies are a decision, not a convenience. See CLAUDE.md.
[dependencies]
bitcoin_hashes = { version = "1.2.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"
