name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One job for each derivation, so the runners work in parallel. A single
      # `nix flake check` puts every gate behind one log and one runner.
      matrix:
        gate: [elo, elo-clippy, elo-test, elo-fmt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # flake.lock pins each tool, and rust-toolchain.toml pins the compiler.
      # No installer step chooses a different version.
      - run: nix build --print-build-logs ".#${{ matrix.gate }}"

      # Build the package a second time. Nix fails the step if the two
      # outputs are not the same bytes.
      - if: matrix.gate == 'elo'
        run: nix build --print-build-logs --rebuild .#elo
