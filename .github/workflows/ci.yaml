name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate:
          - elo
          - elo-clippy
          - elo-test
          - elo-fmt
          - elo-comments
          - elo-fuzz
          - elo-fuzz-image
          - elo-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - run: nix build --print-build-logs ".#${{ matrix.gate }}"

      - if: matrix.gate == 'elo'
        run: nix build --print-build-logs --rebuild .#elo .#elo.cargoArtifacts

  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - run: |
          git -c core.quotePath=false diff HEAD^1 HEAD > "$RUNNER_TEMP/pull-request.diff"
          nix develop --command cargo mutants --in-diff "$RUNNER_TEMP/pull-request.diff" --jobs 2

  fuzz-image:
    name: fuzz image
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - run: nix build --print-build-logs .#elo-fuzz-image

      - run: |
          docker load --input result
          data="$(mktemp --directory)"
          docker run --rm --read-only --network none --user "$(id -u):$(id -g)" \
            --volume "$data:/data" elo-fuzz:local 8

      - env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          head="$(git ls-remote --exit-code origin refs/heads/main)"
          tags="sha-$GITHUB_SHA"
          if test "${head%%[[:space:]]*}" = "$GITHUB_SHA"; then tags="$tags main"; fi
          for tag in $tags; do
            docker tag elo-fuzz:local "ghcr.io/lorenzolfm/elo-fuzz:$tag"
            docker push "ghcr.io/lorenzolfm/elo-fuzz:$tag"
          done

  image:
    name: image
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702

      - run: nix build --print-build-logs .#elo-image

      - run: |
          docker load --input result
          revision='{{index .Config.Labels "org.opencontainers.image.revision"}}'
          test "$(docker inspect elo:local --format "$revision")" = "$GITHUB_SHA"
          datadir="$(mktemp --directory)"
          nix shell --inputs-from . nixpkgs#bitcoind --command bitcoind -regtest \
            -datadir="$datadir" -daemonwait
          docker run --detach --name elo --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network host elo:local regtest 127.0.0.1
          genesis=0f9188f13cb7b2c71f2a335e3a4fc328bf5beb436012afca590b1a11466e2206
          tip="level=info event=tip peer=127.0.0.1:18444 height=0"
          tip="$tip hash=$genesis work=$(printf '%064x' 2)"
          has_tip() { docker logs elo | grep --fixed-strings --line-regexp --quiet "$tip"; }
          for _ in $(seq 60); do
            has_tip && break
            test "$(docker inspect elo --format '{{.State.Running}}')" = true || break
            sleep 1
          done
          docker logs elo
          has_tip
          docker stop --timeout 10 elo
          test "$(docker inspect elo --format '{{.State.ExitCode}}')" = 0

      - env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          head="$(git ls-remote --exit-code origin refs/heads/main)"
          tags="sha-$GITHUB_SHA"
          if test "${head%%[[:space:]]*}" = "$GITHUB_SHA"; then tags="$tags main"; fi
          for tag in $tags; do
            docker tag elo:local "ghcr.io/lorenzolfm/elo:$tag"
            docker push "ghcr.io/lorenzolfm/elo:$tag"
          done
