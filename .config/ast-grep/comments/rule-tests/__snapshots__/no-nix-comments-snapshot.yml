id: no-nix-comments
snapshots:
  "# a\n1":
    labels:
    - source: "# a"
      style: primary
      start: 0
      end: 3
  /* a */ 1:
    labels:
    - source: /* a */
      style: primary
      start: 0
      end: 7
  "1 # a":
    labels:
    - source: "# a"
      style: primary
      start: 2
      end: 5
