id: no-nix-string-comments
snapshots:
  "''\n  # a\n  echo\n''":
    labels:
    - source: |2
        
          # a
          echo
      style: primary
      start: 2
      end: 16
    - source: |-
        ''
          # a
          echo
        ''
      style: secondary
      start: 0
      end: 18
  "''\n  echo\n  #! a\n''":
    labels:
    - source: |2
        
          echo
          #! a
      style: primary
      start: 2
      end: 17
    - source: |-
        ''
          echo
          #! a
        ''
      style: secondary
      start: 0
      end: 19
  "''\n  echo\n  #a\n''":
    labels:
    - source: |2
        
          echo
          #a
      style: primary
      start: 2
      end: 15
    - source: |-
        ''
          echo
          #a
        ''
      style: secondary
      start: 0
      end: 17
  "''\n  echo ${x}\n  # a\n''":
    labels:
    - source: |2
        
          # a
      style: primary
      start: 14
      end: 21
    - source: |-
        ''
          echo ${x}
          # a
        ''
      style: secondary
      start: 0
      end: 23
