id: no-yaml-run-comments
language: yaml
severity: error
message: >-
  No comments, in a step's script either. Say it in the code: a name, a type, a test.
rule:
  kind: block_scalar
  regex: \n[ \t]*#([^\[!]|![^/])
  inside:
    kind: block_node
    inside:
      kind: block_mapping_pair
      has:
        field: key
        regex: ^run$
